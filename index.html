<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A calm, colourful space to keep your next small steps in view."
    />
    <meta name="theme-color" content="#f6f7f1" />
    <title>Daymark — a little progress, every day</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Daymark home">
          <span class="wordmark__icon" aria-hidden="true">d</span>
          <span>daymark</span>
        </a>
        <span class="topbar__note">A little progress, every day</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span aria-hidden="true"></span> YOUR PERSONAL TASK SPACE</p>
        <h1 id="page-title">Make room for<br /><em>what matters.</em></h1>
        <p class="intro__copy">
          One small step at a time. Add a task, move it forward, and celebrate
          the progress.
        </p>
      </section>

      <section class="board" aria-label="Your tasks">
        <form class="composer" id="task-form">
          <label class="sr-only" for="title">What would you like to do?</label>
          <span class="composer__plus" aria-hidden="true">+</span>
          <input
            id="title"
            name="title"
            type="text"
            placeholder="What would you like to do?"
            autocomplete="off"
            maxlength="120"
            required
          />
          <button type="submit">Add task <span aria-hidden="true">↗</span></button>
        </form>

        <div class="list-heading">
          <div>
            <h2>Your list</h2>
            <p id="task-count" aria-live="polite"></p>
          </div>
          <div class="filters" id="filter-controls" aria-label="Filter tasks">
            <button type="button" data-status="all" aria-pressed="true">All</button>
            <button type="button" data-status="todo" aria-pressed="false">To do</button>
            <button type="button" data-status="in-progress" aria-pressed="false">
              In progress
            </button>
            <button type="button" data-status="done" aria-pressed="false">Done</button>
          </div>
        </div>

        <ul class="task-list" id="task-list" aria-label="Task list"></ul>
        <p class="empty-state" id="empty-state"></p>
      </section>

      <footer class="footer">
        <span>Made for the next thing that matters.</span>
        <span class="footer__sparkle" aria-hidden="true">✳</span>
      </footer>
    </main>
  </body>
</html>
